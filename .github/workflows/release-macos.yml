name: Build macOS release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-macos.yml

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build universal macOS app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "Minesweeper.app"
          file "Minesweeper.app/Contents/MacOS/Minesweeper"
          lipo "Minesweeper.app/Contents/MacOS/Minesweeper" -verify_arch arm64
          lipo "Minesweeper.app/Contents/MacOS/Minesweeper" -verify_arch x86_64

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "Minesweeper.app" "Minesweeper-macOS-v1.0.0.zip"
          shasum -a 256 "Minesweeper-macOS-v1.0.0.zip"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset v1.0.0 --yes -- "-macOS-v1.0.0.zip" || true
          gh release upload v1.0.0 "Minesweeper-macOS-v1.0.0.zip" --clobber
